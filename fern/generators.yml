# Staging-only beta registration. Promote the issuer, client and API audience
# together after live OAuth acceptance; no client secret belongs in this repo.
auth-schemes:
  bearer:
    scheme: oauth
    type: authorization-code
    client-id: client_01M721J47S27BS1GSXK1780TSR
    authorization-url: https://nourishing-mulberry-12-staging.authkit.app/oauth2/authorize
    token-url: https://nourishing-mulberry-12-staging.authkit.app/oauth2/token
    refresh-url: https://nourishing-mulberry-12-staging.authkit.app/oauth2/token
    scopes: [openid, offline_access]
    redirect-uri:
      url: http://127.0.0.1:8484/callback
      ports: [8485, 8486]
    authorization-parameters:
      resource: https://api-mcp-poc.vapi.local
    token-parameters:
      resource: https://api-mcp-poc.vapi.local
    refresh-parameters:
      resource: https://api-mcp-poc.vapi.local
api:
  auth: bearer
  specs:
    - openapi: openapi.json
      overrides:
        - openapi-overrides.yml
        - cli-overrides.yml
      overlays: openapi-parameter-descriptions-overlay.yml
      settings:
        title-as-schema-name: false
        coerce-enums-to-literals: false
        respect-nullable-schemas: true
default-group: cli
groups:
  cli:
    generators:
      - name: fern-cli-generator
        version: 0.59.1
        output:
          location: local-file-system
          path: ../generated
        config: &cli-config
          binaryName: vapi
          customCommands: false
          generateWireTests: true
          distribution:
            homebrew:
              tap: VapiAI/homebrew-tap
              formula: vapi-cli
          profiles:
            enabled: true
          packageIdentity:
            name: vapi-cli
            description: Voice AI for developers - Vapi CLI
            authors: ["Vapi <support@vapi.ai>"]
            keywords: ["vapi", "voice", "ai", "cli"]
            license: MIT
            repository: https://github.com/VapiAI/cli
            homepage: https://vapi.ai
  publish:
    generators:
      - name: fern-cli-generator
        version: 0.59.1
        output:
          location: npm
          package-name: "@vapi-ai/cli"
          token: OIDC
        github:
          repository: VapiAI/cli
          mode: pull-request
        config: *cli-config
