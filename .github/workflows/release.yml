name: Release
on:
  push:
    tags: ['v1.*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: Darwin_arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: Darwin_x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: Linux_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: Linux_arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: Windows_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install pinned Rust and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Verify release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check-version.py "${GITHUB_REF_NAME#v}"
          else
            python scripts/check-version.py
          fi
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export CC=musl-gcc
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          cargo build --release --locked --target "$TARGET"
      - name: Smoke test binary and create archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist staging
          cp LICENSE LICENSE-APACHE NOTICE staging/
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$TARGET/release/vapi.exe" staging/
            ./staging/vapi.exe --version
            ./staging/vapi.exe --schema > /dev/null
            powershell.exe -NoProfile -Command 'Compress-Archive -Path staging/* -DestinationPath ("dist/cli_" + $env:ASSET + ".zip")'
          else
            cp "target/$TARGET/release/vapi" staging/
            ./staging/vapi --version
            ./staging/vapi --schema > /dev/null
            tar -czf "dist/cli_$ASSET.tar.gz" -C staging vapi LICENSE LICENSE-APACHE NOTICE
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Create checksums and GitHub release
        id: version
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum cli_* > checksums.txt
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}" ./*
  npm:
    needs: release
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
