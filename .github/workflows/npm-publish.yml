name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update package version
        working-directory: npm-wrapper
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version --ignore-scripts

      - name: Pack npm artifact
        working-directory: npm-wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      # Keep package code and caches out of the job with publishing authority.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .release

      - name: Publish npm artifact
        run: |
          tarballs=(.release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one npm package tarball."
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --ignore-scripts
