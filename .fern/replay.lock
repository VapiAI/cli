                        prop_type: Some("string".to_string()),
                        format: Some("email".to_string()),
                        ..Default::default()
                    },
                );
                let mut schemas = HashMap::new();
                schemas.insert(
                    "CreateUser".to_string(),
                    JsonSchema {
                        schema_type: Some("object".to_string()),
                        properties: body_props,
                        required: vec!["name".to_string()],
